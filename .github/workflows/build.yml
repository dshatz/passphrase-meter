name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Only enabled targets are tested: JVM + linuxX64 (common code, JNI, zxcvbn, PIN reference) on Linux, Android on an emulator.
jobs:
  native:
    uses: ./.github/workflows/native.yml
    secrets: inherit

  test-linux:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
      - name: Build and Test
        run: ./gradlew :core:jvmTest :core:linuxX64Test :core:assembleAndroidDeviceTest
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-ubuntu-latest
          path: ./**/build/test-results/**/*.xml
          retention-days: 5

  test-android-emulator:
    # Runs on an x86_64 emulator, needs no secrets, so it also works for fork PRs.
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumentation Tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :core:connectedAndroidDeviceTest
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-emulator-android
          path: ./core/build/outputs/androidTest-results/**/*.xml
          retention-days: 5

  publish-results:
    needs:
      - test-linux
      - test-android-emulator
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*

      - name: Multiplatform Test Report
        uses: dshatz/testballoon-github-reporter@master
        with:
          reports: "test-report-*/**/*.xml"
          platform-hints: |
            {
              "test-report-ubuntu-latest/**/*.xml": "Linux",
              "test-report-emulator-android/**/*.xml": "Android (emulator)"
            }
