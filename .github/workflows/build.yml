name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Only enabled targets are tested: JVM + linuxX64 (common code, JNI, zxcvbn, PIN reference) on Linux,
# macosArm64 + iosSimulatorArm64 on macOS (Apple Silicon), Android on an emulator.
jobs:
  native:
    uses: ./.github/workflows/native.yml
    secrets: inherit

  test-linux:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
      - name: Build and Test
        run: ./gradlew :core:jvmTest :core:linuxX64Test :core:assembleAndroidDeviceTest
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-ubuntu-latest
          path: ./**/build/test-results/**/*.xml
          retention-days: 5

  test-apple:
    # Apple Silicon runner: runs macosArm64 natively and iosSimulatorArm64 on a simulator.
    needs: native
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The first iOS test run against a cold CoreSimulator can fail before any test runs
      # (missing in-progress-results-generic.bin), so boot a simulator up front. `simctl boot`
      # returns immediately, so the boot overlaps with setup and compilation; the tests then run on
      # this device (core/build.gradle.kts reads SIM_UDID) instead of Gradle booting another one.
      - name: Start iOS simulator boot
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,ds in d.items() if "iOS" in r for x in ds if x["name"].startswith("iPhone")))')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
      - name: Compile tests
        run: ./gradlew :core:macosArm64TestBinaries :core:iosSimulatorArm64TestBinaries --continue
      - name: Wait for iOS simulator
        run: xcrun simctl bootstatus "$SIM_UDID"
      - name: Build and Test
        run: ./gradlew :core:macosArm64Test :core:iosSimulatorArm64Test --continue
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-macos-latest
          path: ./**/build/test-results/**/*.xml
          retention-days: 5

  test-android-emulator:
    # Runs on an x86_64 emulator, needs no secrets, so it also works for fork PRs.
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumentation Tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :core:connectedAndroidDeviceTest
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-emulator-android
          path: ./core/build/outputs/androidTest-results/**/*.xml
          retention-days: 5

  publish-results:
    needs:
      - test-linux
      - test-apple
      - test-android-emulator
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*

      - name: Multiplatform Test Report
        uses: dshatz/testballoon-github-reporter@master
        with:
          reports: "test-report-*/**/*.xml"
          platform-hints: |
            {
              "test-report-ubuntu-latest/**/*.xml": "Linux",
              "test-report-macos-latest/**/*.xml": "macOS / iOS (simulator)",
              "test-report-emulator-android/**/*.xml": "Android (emulator)"
            }
