name: Publish Release

on:
  release:
    types: [published]

jobs:
  native:
    uses: ./.github/workflows/native.yml
    secrets: inherit

  publish-all:
    needs: native
    # macOS, like Kotlin-JNI: the only host that can link every target once Apple targets are enabled.
    # libzxcvbn.a for all targets comes prebuilt from the "native" job.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}

      - id: get_version
        name: Get version
        uses: jannemattila/get-version-from-tag@v4

      - name: Publish release
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_version: ${{ steps.get_version.outputs.version }}

  release-dictionaries:
    # Attaches the prebuilt dictionaries (and the licenses/attributions to ship with them) to the release.
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native
          path: native
      - name: Package
        working-directory: native/dictionaries
        run: |
          zip -q ../passphrase-meter-dictionaries.zip *.dict NOTICE-dictionaries.md
          sha256sum *.dict NOTICE-dictionaries.md ../passphrase-meter-dictionaries.zip | sed 's#\.\./##' > SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            native/dictionaries/*.dict native/dictionaries/NOTICE-dictionaries.md \
            native/dictionaries/SHA256SUMS native/passphrase-meter-dictionaries.zip
